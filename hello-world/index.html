<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="A little hello, made with care.">
  <title>Hello, world! — A little moment of joy</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101522;
      color: #f7f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #aab2c5;
      --accent: #a8f0d1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(102, 115, 196, .2), transparent 40%),
        radial-gradient(ellipse at 15% 85%, rgba(64, 190, 163, .11), transparent 38%),
        #101522;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: min(100% - 2rem, 900px);
      padding: clamp(2rem, 7vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255,255,255,.09);
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .scene::before, .scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 11rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .55;
      animation: float 7s ease-in-out infinite alternate;
    }
    .scene::before { top: -5rem; left: -4rem; background: radial-gradient(circle at 35% 35%, #a8f0d1, #75c9ed 45%, transparent 72%); }
    .scene::after { right: -4rem; bottom: -5rem; background: radial-gradient(circle at 35% 35%, #bea8ff, #7f86e8 45%, transparent 72%); animation-delay: -3s; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: "✦"; font-size: .95rem; }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 10vw, 7.5rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 750;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #a8f0d1 8%, #9edaf4 48%, #c5b5ff 92%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 34rem;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.75;
    }

    .sparkle {
      position: absolute;
      color: rgba(255,255,255,.7);
      font-size: 1rem;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    .sparkle.one { top: 18%; left: 15%; }
    .sparkle.two { top: 24%; right: 13%; font-size: .7rem; animation-delay: .8s; }
    .sparkle.three { bottom: 19%; left: 22%; font-size: .65rem; animation-delay: 1.4s; }

    .footer {
      position: fixed;
      inset: auto 1rem 1.25rem;
      color: rgba(213,220,237,.48);
      text-align: center;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { to { transform: translate3d(12px, -12px, 0) scale(1.08); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(18deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <span class="sparkle one" aria-hidden="true">✦</span>
  <span class="sparkle two" aria-hidden="true">✧</span>
  <span class="sparkle three" aria-hidden="true">✦</span>

  <main class="scene">
    <p class="eyebrow">A fresh beginning</p>
    <h1>Hello,<span>world!</span></h1>
    <p class="message">A tiny page, a brand-new start, and a little reminder that the web can still feel like magic.</p>
  </main>

  <footer class="footer">Made with a little bit of wonder</footer>
</body>
</html>
