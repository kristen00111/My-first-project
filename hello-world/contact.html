<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Get in touch — we'd love to hear from you.">
  <title>Contact — A little moment of joy</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101522; color: #f7f8fc; --muted: #aab2c5; --accent: #a8f0d1; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 2rem 1rem 5rem; background: radial-gradient(ellipse at 50% 42%, rgba(102,115,196,.2), transparent 42%), radial-gradient(ellipse at 15% 85%, rgba(64,190,163,.11), transparent 38%), #101522; }
    .wrap { width: min(100%, 760px); }
    nav { display: flex; justify-content: center; gap: .5rem; margin-bottom: 1.25rem; }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .2s, background .2s; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.09); }
    .card { padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgba(255,255,255,.1); border-radius: 2rem; background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: 0 32px 100px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.09); backdrop-filter: blur(18px); text-align: center; animation: arrive .7s ease-out both; }
    .eyebrow { margin: 0 0 1rem; color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -.07em; }
    .intro { max-width: 31rem; margin: 1.25rem auto 2rem; color: var(--muted); line-height: 1.75; }
    .contact-link { display: inline-flex; align-items: center; gap: .65rem; padding: .95rem 1.25rem; border: 1px solid rgba(168,240,209,.35); border-radius: 999px; color: #101522; background: linear-gradient(100deg, #a8f0d1, #9edaf4); text-decoration: none; font-weight: 700; box-shadow: 0 8px 30px rgba(120,220,190,.15); transition: transform .2s, box-shadow .2s; }
    .contact-link:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(120,220,190,.25); }
    .note { margin: 1rem 0 0; color: rgba(213,220,237,.52); font-size: .82rem; }
    footer { position: fixed; inset: auto 1rem 1.25rem; color: rgba(213,220,237,.48); text-align: center; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <main class="card">
      <p class="eyebrow">Say hello</p>
      <h1>Let's talk.</h1>
      <p class="intro">Have a question, an idea, or just want to say hi? Send a note — we'd love to hear from you.</p>
      <a class="contact-link" href="mailto:hello@example.com">✉ <span>Email us</span></a>
      <p class="note">Replace hello@example.com with your email address.</p>
    </main>
  </div>
  <footer>Made with a little bit of wonder</footer>
</body>
</html>
